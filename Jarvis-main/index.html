<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
            position: relative;
            flex-direction: column;
        }

        /* Background GIF */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Content Section */
        .content {
            text-align: center;
            z-index: 2;
            position: relative;
        }

        .content h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-top: 30px;
        }

        /* Start Listening Button */
        .listen-btn {
            background: #4a90e2;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            text-transform: uppercase;
        }

        .listen-btn img {
            width: 20px;
            height: 20px;
            margin-left: 10px;
        }

        .listen-btn:hover {
            background: #357ABD;
        }

        .listen-btn:active {
            transform: scale(0.98);
        }

        /* Input and Button Container */
        .input-container {
            display: flex;
            align-items: center;
            width: 360px;
        }

        /* Input Box */
        input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            text-align: center;
            font-weight: bold;
            outline: none;
            border: none;
            border-radius: 25px;
            padding: 12px 15px;
            font-size: 1rem;
            height: 40px;
        }

        input[type="text"]::placeholder {
            color: #eee;
            font-size: 0.9rem;
        }

        /* Send Button */
        .send-btn {
            width: 45px;
            height: 45px;
            border: none;
            background: transparent;
            cursor: pointer;
            margin-left: 8px;
        }

        .send-btn img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .send-btn:hover img {
            transform: scale(1.1);
        }

        /* Response Box */
        .response-box {
            margin-top: 40px;
            width: 80%;
            max-width: 500px;
            min-height: 50px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            text-align: left;
            font-size: 0.9rem;
            font-weight: bold;
            transition: max-height 0.3s ease-in-out;
        }

        .response-box p {
            margin: 5px 0;
            line-height: 1.5;
        }
    </style>
    
</head>
<body>
    <!-- Background GIF -->
    <div class="background">
        <img src="https://cdn.dribbble.com/users/14038/screenshots/6372831/voice_wave.gif" alt="Animated Background">
    </div>

    <!-- Content -->
    <div class="content">
        <h1>What can I help you with?</h1>

        <!-- Input Controls -->
        <div class="controls">
            <!-- Start Listening Button -->
            <button id="start-btn" class="listen-btn">
                Start Listening
                <img src="https://seekicon.com/free-icon-download/keyboard-voice_1.svg" alt="Mic">
            </button>
            
            <!-- Input Field with Send Button -->
            <div class="input-container">
                <input type="text" id="text-input" placeholder="Type your command...">
                <button id="submit-btn" class="send-btn">
                    <img src="https://cdn-icons-png.flaticon.com/512/8280/8280670.png" alt="Send">
                </button>
            </div>
        </div>

        <!-- Assistant Response Box -->
        <div class="response-box" id="response-box"></div>
    </div>

    <!-- Include Eel -->
    <script src="/eel.js"></script>
    <script src="script.js"></script>


</body>
</html>
